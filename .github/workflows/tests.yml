name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e . pytest pytest-cov

      - name: Run tests
        run: python -m pytest --cov=narrative_humanizer --cov-report=term-missing

      - name: Build sdist and wheel (catches packaging regressions, e.g. bad `readme` paths)
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist .

      - name: Smoke-test the installed CLI entrypoint
        run: narrative-humanizer list-checklist
