[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-humanizer"
version = "0.1.0"
description = "Detect and fix AI-typical narrative-structure defaults in fiction, grounded in the StoryScope (COLM 2026) findings."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Safeer Ahmad" }]
dependencies = [
    "anthropic>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/SafeerAhmad211/narrative-humanizer"
Paper = "https://arxiv.org/abs/2604.03136"

[project.scripts]
narrative-humanizer = "narrative_humanizer.cli:main"

[tool.setuptools.packages.find]
include = ["narrative_humanizer*"]
